services:
  - type: web
    runtime: static
    name: kuro
 
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist

    envVars:
      - key: NODE_VERSION
        value: "22"
        
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

      - path: /models/*
        name: Cache-Control
        value: public, max-age=604800

      - path: /moon/*
        name: Cache-Control
        value: public, max-age=604800

      - path: /data/*
        name: Cache-Control
        value: public, max-age=604800

      - path: /hero/*
        name: Cache-Control
        value: public, max-age=604800

      - path: /compare/*
        name: Cache-Control
        value: public, max-age=604800

      - path: /vision/*
        name: Cache-Control
        value: public, max-age=604800
